 restart:()=>{P.lives=3;loadLevel(LVI,1)},menu:()=>{loadLevel(0);state='menu';$('#hud').style.display='none';show('menu')}};
ov.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;ac();sfx.ui();ACT[a]()});
ov.addEventListener('input',e=>{if(e.target.id=='vol'){cfg.vol=+e.target.value;if(master)master.gain.value=cfg.vol}if(e.target.id=='qual')setQual(e.target.value);if(e.target.id=='shd'){cfg.shadow=e.target.checked;sun.castShadow=cfg.shadow;R.shadowMap.enabled=cfg.shadow;S.traverse(o=>{if(o.material)o.material.needsUpdate=true})}});
/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,1/30);last=now;T+=dt;
 if(state==='play'){if(intro>0){intro-=dt;if(K.Space||K.Enter)intro=0}else updateWorld(dt);hud()}
 else if(state==='clear'){clearT-=dt;if(clearT<=0){if(LVI<2)loadLevel(LVI+1);else{state='win';$('#hud').style.display='none';show('win')}}}
 if(state==='play'||state==='clear'||state==='menu'){
  for(const c of coins)if(c.on)c.m.rotation.y=T*3;
  for(const a of apPool)if(a.on){a.g.position.y=a.y0+Math.sin(T*3+a.g.position.x)*.12;a.g.rotation.y=T*1.5}
  for(const c of clouds){c.position.x+=dt*.8;if(c.position.x>130)c.position.x=-130}
  ring.rotation.y=T;water.position.set(P.p.x,-9+Math.sin(T)*.1,P.p.z);updParticles(dt)}
 animHero(dt);sun.position.copy(P.p).addScaledVector(SUNV,70);sun.target.position.copy(P.p);updCam(dt);fxUpdate(dt);
 fA+=dt;if(++fN==60){const ms=fA/60*1000;fA=fN=0;if(T>6){if(ms>24&&prS>.55){prS*=.85;resize()}else if(ms<15&&prS<1){prS=Math.min(1,prS*1.1);resize()}}}
 comp?comp.render():R.render(S,cam)}let fA=0,fN=0;
loadLevel(0);state='menu';$('#hud').style.display='none';show('menu');requestAnimationFrame(frame);
</script></body></html>
