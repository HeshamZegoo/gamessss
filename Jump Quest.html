<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jump Quest</title>
<style>
  :root{
    --sky1:#7ec8f2; --sky2:#bfe8ff; --ground:#8b5a2b; --grass:#4caf50;
    --ui-bg:rgba(0,0,0,0.55); --ui-text:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#222;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;}
  #wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;}
  canvas{width:100%;height:100%;display:block;border-radius:8px;background:linear-gradient(var(--sky1),var(--sky2));touch-action:none;}
  #hud{position:absolute;top:10px;left:10px;color:var(--ui-text);background:var(--ui-bg);
    padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600;}
  #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:var(--ui-text);background:var(--ui-bg);padding:16px 24px;border-radius:12px;
    font-size:20px;text-align:center;display:none;}
  #msg button{margin-top:10px;padding:8px 16px;border:none;border-radius:6px;background:#ffcc33;
    font-weight:700;cursor:pointer;}
  #controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 12px;pointer-events:none;}
  #controls button{pointer-events:auto;width:56px;height:56px;border-radius:50%;border:none;
    background:rgba(255,255,255,0.35);font-size:22px;color:#fff;}
  #left{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">⭐ <span id="coins">0</span>/<span id="total">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; Lvl <span id="lvl">1</span></div>
  <div id="msg"><div id="msgText"></div><button id="msgBtn">Continue</button></div>
  <div id="controls">
    <div id="left">
      <button id="btnL">◀</button>
      <button id="btnR">▶</button>
    </div>
    <button id="btnJ">⤴ Jump</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = canvas.clientWidth*2; canvas.height = canvas.clientHeight*2; }
window.addEventListener('resize', resize); resize();

const W=()=>canvas.width, H=()=>canvas.height;
const GRAV=0.9, MOVE=5.5, JUMP=-17;
let coinsEl=document.getElementById('coins'), totalEl=document.getElementById('total'),
    livesEl=document.getElementById('lives'), lvlEl=document.getElementById('lvl');
let msg=document.getElementById('msg'), msgText=document.getElementById('msgText'), msgBtn=document.getElementById('msgBtn');

// Levels: platforms(x,y,w,h), coins(x,y), enemies(x,y,range), goal(x,y), spawn
const levels = [
  {
    spawn:{x:40,y:300},
    platforms:[{x:0,y:380,w:2400,h:40},{x:300,y:300,w:120,h:20},{x:500,y:250,w:120,h:20},
      {x:700,y:320,w:150,h:20},{x:950,y:260,w:100,h:20},{x:1150,y:200,w:100,h:20},
      {x:1400,y:300,w:200,h:20},{x:1700,y:340,w:150,h:20},{x:2000,y:280,w:150,h:20}],
    coins:[[340,260],[540,210],[740,280],[980,220],[1180,160],[1440,260],[1730,300],[2030,240],[2200,240]],
    enemies:[{x:500,y:376,range:120,x0:500},{x:950,y:376,range:100,x0:950},{x:1700,y:376,range:130,x0:1700}],
    goal:{x:2300,y:220}
  },
  {
    spawn:{x:40,y:300},
    platforms:[{x:0,y:380,w:600,h:40},{x:650,y:380,w:300,h:40},{x:1000,y:340,w:150,h:20},
      {x:1200,y:280,w:150,h:20},{x:1400,y:220,w:150,h:20},{x:1600,y:280,w:150,h:20},
      {x:1850,y:340,w:200,h:20},{x:2100,y:380,w:300,h:40}],
    coins:[[200,340],[700,340],[1040,300],[1240,240],[1440,180],[1640,240],[1900,300],[2200,340],[2350,340]],
    enemies:[{x:700,y:376,range:200,x0:700},{x:1200,y:236,range:80,x0:1200},{x:2150,y:376,range:200,x0:2150}],
    goal:{x:2350,y:260}
  }
];

let levelIdx=0, lvl, player, keys={}, camX=0, coinsCollected=0, lives=3, gameOver=false, paused=false;

function loadLevel(i){
  lvl = JSON.parse(JSON.stringify(levels[i]));
  player = {x:lvl.spawn.x,y:lvl.spawn.y,w:34,h:44,vx:0,vy:0,onGround:false,dir:1,dead:false,alive:true};
  coinsCollected=0;
  totalEl.textContent = lvl.coins.length;
  coinsEl.textContent = 0;
  lvlEl.textContent = i+1;
  lvl.enemies.forEach(e=>{e.vx=1.6;});
  camX=0;
}
loadLevel(0);

function rectsOverlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

function showMsg(text, cb){
  msgText.textContent=text;
  msg.style.display='block';
  msgBtn.onclick=()=>{msg.style.display='none'; cb&&cb();};
}

function resetPlayer(){
  player.x=lvl.spawn.x; player.y=lvl.spawn.y; player.vx=0; player.vy=0;
}

function loseLife(){
  lives--; livesEl.textContent=lives;
  if(lives<=0){
    gameOver=true;
    showMsg("Game Over! Final score: "+coinsCollected+" stars", ()=>{
      lives=3; livesEl.textContent=3; levelIdx=0; loadLevel(0); gameOver=false;
    });
  } else {
    resetPlayer();
  }
}

function update(){
  if(gameOver||paused) return;
  const scale = W()/900;
  // input
  let left = keys['ArrowLeft']||keys['a'];
  let right = keys['ArrowRight']||keys['d'];
  player.vx = 0;
  if(left){ player.vx=-MOVE; player.dir=-1; }
  if(right){ player.vx=MOVE; player.dir=1; }
  player.vy += GRAV;
  if(player.vy>20) player.vy=20;

  let px = player.x + player.vx;
  let py = player.y + player.vy;

  // horizontal collision
  let pbox = {x:px,y:player.y,w:player.w,h:player.h};
  for(const p of lvl.platforms){
    if(rectsOverlap(pbox,p)){
      if(player.vx>0) px = p.x-player.w;
      else if(player.vx<0) px = p.x+p.w;
    }
  }
  player.x = px;

  // vertical collision
  pbox = {x:player.x,y:py,w:player.w,h:player.h};
  player.onGround=false;
  for(const p of lvl.platforms){
    if(rectsOverlap(pbox,p)){
      if(player.vy>0){ py = p.y-player.h; player.onGround=true; player.vy=0; }
      else if(player.vy<0){ py = p.y+p.h; player.vy=0; }
    }
  }
  player.y = py;

  if(player.y>H()/scale+200){ loseLife(); return; }

  // coins
  lvl.coins = lvl.coins.filter(([cx,cy])=>{
    const cbox={x:cx-10,y:cy-10,w:20,h:20};
    if(rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h},cbox)){
      coinsCollected++; coinsEl.textContent=coinsCollected;
      return false;
    }
    return true;
  });

  // enemies
  for(const e of lvl.enemies){
    e.x += e.vx;
    if(e.x < e.x0-e.range/2 || e.x > e.x0+e.range/2) e.vx*=-1;
    const ebox={x:e.x,y:e.y-24,w:28,h:24};
    const pbox2={x:player.x,y:player.y,w:player.w,h:player.h};
    if(rectsOverlap(pbox2,ebox)){
      if(player.vy>0 && player.y+player.h-e.y< 16){
        // stomp
        e.dead=true; player.vy=-11;
      } else if(!e.dead){
        loseLife(); return;
      }
    }
  }
  lvl.enemies = lvl.enemies.filter(e=>!e.dead);

  // goal
  const gbox={x:lvl.goal.x,y:lvl.goal.y,w:20,h:80};
  if(!paused && rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h},gbox)){
    paused = true;
    if(levelIdx < levels.length-1){
      const nextIdx = levelIdx+1;
      showMsg("Level Complete! Stars: "+coinsCollected, ()=>{ levelIdx=nextIdx; loadLevel(levelIdx); paused=false; });
    } else {
      showMsg("🎉 You Win! Total stars: "+coinsCollected, ()=>{
        levelIdx=0; loadLevel(0); paused=false;
      });
    }
  }

  // camera
  camX = Math.max(0, player.x - (W()/scale)/2);
}

function draw(){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.restore();

  const scale = W()/900;
  ctx.save();
  ctx.setTransform(scale,0,0,scale,-camX*scale,0);

  // ground decoration
  for(const p of lvl.platforms){
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ground');
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--grass');
    ctx.fillRect(p.x,p.y,p.w,8);
  }

  // coins
  for(const [cx,cy] of lvl.coins){
    ctx.beginPath();
    ctx.fillStyle='#ffd700';
    ctx.arc(cx,cy,9,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#b8860b'; ctx.lineWidth=2; ctx.stroke();
  }

  // enemies
  for(const e of lvl.enemies){
    ctx.fillStyle='#7a3ea1';
    ctx.beginPath();
    ctx.ellipse(e.x+14,e.y-12,14,12,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(e.x+9,e.y-14,3,0,Math.PI*2); ctx.arc(e.x+19,e.y-14,3,0,Math.PI*2); ctx.fill();
  }

  // goal flag
  ctx.fillStyle='#555';
  ctx.fillRect(lvl.goal.x, lvl.goal.y, 6, 80);
  ctx.fillStyle='#ff3b30';
  ctx.beginPath();
  ctx.moveTo(lvl.goal.x+6, lvl.goal.y);
  ctx.lineTo(lvl.goal.x+40, lvl.goal.y+12);
  ctx.lineTo(lvl.goal.x+6, lvl.goal.y+24);
  ctx.fill();

  // player
  ctx.save();
  ctx.translate(player.x+player.w/2, player.y+player.h/2);
  if(player.dir<0) ctx.scale(-1,1);
  // body
  ctx.fillStyle='#e63946';
  ctx.fillRect(-player.w/2,-player.h/2+10,player.w,player.h-10);
  // head
  ctx.fillStyle='#ffd6a5';
  ctx.beginPath(); ctx.arc(0,-player.h/2+8,13,0,Math.PI*2); ctx.fill();
  // cap
  ctx.fillStyle='#1d3557';
  ctx.beginPath(); ctx.arc(0,-player.h/2+3,13,Math.PI,0); ctx.fill();
  ctx.fillRect(-13,-player.h/2-2,26,6);
  ctx.fillRect(10,-player.h/2-2,14,5);
  ctx.restore();

  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ if(player.onGround){player.vy=JUMP;} }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

function bindHold(id,key){
  const el=document.getElementById(id);
  const on=(ev)=>{ev.preventDefault();keys[key]=true;};
  const off=(ev)=>{ev.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',on); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindHold('btnL','ArrowLeft');
bindHold('btnR','ArrowRight');
document.getElementById('btnJ').addEventListener('click', ()=>{ if(player.onGround) player.vy=JUMP; });
document.getElementById('btnJ').addEventListener('touchstart', (e)=>{ e.preventDefault(); if(player.onGround) player.vy=JUMP; });

requestAnimationFrame(loop);
</script>
</body>
</html>
