 z+=pd/2+3+6;addPlat(x,y,z,12,12,mats);goal.set(x,y,z);endZ=z;
 ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.18,12,36),M(0xffd21a,.2,.9,{emissive:0xaa7700}));ring.position.set(x,y+2.6,z);LG.add(ring);
 for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.15,.2,3,10),M(0xeeeeee,.4));p.position.set(x+s*1.8,y+1.5,z);LG.add(p)}
 water=new THREE.Mesh(new THREE.PlaneGeometry(600,600),M(0x2a9ad8,.05,.2,{transparent:true,opacity:.85}));water.rotation.x=-Math.PI/2;water.position.y=-9;LG.add(water);
 for(let i=0;i<14;i++){const c=new THREE.Group();for(let k=0;k<4;k++){const b=new THREE.Mesh(new THREE.SphereGeometry(3+rnd()*2,12,10),M(0xffffff,1,0,{emissive:0x888888}));b.position.set(k*3.5,rnd()*1.5,rnd()*2);b.scale.y=.6;c.add(b)}
  c.position.set((rnd()-.5)*220,28+rnd()*18,rnd()*endZ);LG.add(c);clouds.push(c)}
 for(let i=0;i<14;i++){const h=40+rnd()*40,m=new THREE.Mesh(new THREE.ConeGeometry(h*.7,h,7),M(th.mtn,1));m.position.set((i%2?1:-1)*(110+rnd()*40),h/2-10,(i/14)*(endZ+120)-40);LG.add(m)}}
/* ---------- player ---------- */
const P={p:new V3(),v:new V3(),yaw:0,ground:null,coy:0,buf:0,jumps:0,inv:0,sq:0,spin:0,lives:3,cut:0,ph:0},RD=.4,HT=1.7,lastCP=new V3();
let state='menu',score=0,coinN=0,appleN=0,T=0,spawnT=3,clearT=0;
const K={};
addEventListener('keydown',e=>{if(e.repeat)return;K[e.code]=1;if(e.code=='Space'){P.buf=.12;e.preventDefault()}if(e.code=='Escape'||e.code=='KeyP')togglePause()});
addEventListener('keyup',e=>{K[e.code]=0;if(e.code=='Space'&&P.v.y>0&&!P.cut){P.v.y*=.5;P.cut=1}});
let drag=0;const cvs=$('#c');cvs.addEventListener('pointerdown',()=>drag=1);addEventListener('pointerup',()=>drag=0);addEventListener('pointermove',e=>{if(drag)camYaw-=e.movementX*.005});
function resolve(a){const p=P.p;for(const b of solids){
 if(p.x+RD<=b.min.x||p.x-RD>=b.max.x||p.z+RD<=b.min.z||p.z-RD>=b.max.z||p.y+HT<=b.min.y||p.y>=b.max.y)continue;
 if(a=='y'){if(P.v.y<=0){p.y=b.max.y;P.v.y=0;P.ground=b}else{p.y=b.min.y-HT;P.v.y=0}}
 else if(p.y+.4>=b.max.y){p.y=b.max.y;if(P.v.y<0)P.v.y=0;P.ground=b}
 else if(a=='x'){p.x=p.x<(b.min.x+b.max.x)/2?b.min.x-RD:b.max.x+RD;P.v.x=0}
 else{p.z=p.z<(b.min.z+b.max.z)/2?b.min.z-RD:b.max.z+RD;P.v.z=0}}}
function doJump(v,n){P.v.y=v;P.jumps=n;P.buf=0;P.coy=0;P.cut=0;P.ground=null;sfx.jump();burst(P.p.x,P.p.y+.1,P.p.z,0xffffff,6)}
function updPlayer(dt){
 const fx=Math.sin(camYaw),fz=Math.cos(camYaw);camYaw+=((K.KeyE?1:0)-(K.KeyQ?1:0))*1.8*dt;
 let iz=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),ix=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0);const l=Math.hypot(ix,iz)||1;ix/=l;iz/=l;
 const maxS=9.5*(1-Math.min(SN.len,30)*.012)*(SN.pow>0?1.5:1),g0=!!P.ground,has=ix||iz,rate=(has?(g0?60:36):(g0?45:8))*dt;
 P.v.x+=clamp((fx*iz-fz*ix)*maxS-P.v.x,-rate,rate);P.v.z+=clamp((fz*iz+fx*ix)*maxS-P.v.z,-rate,rate);
 if(g0){P.coy=.1;P.jumps=0}else{P.coy-=dt;if(P.coy<=0&&P.jumps==0)P.jumps=1}P.buf-=dt;
 if(P.buf>0){if(P.coy>0)doJump(12.5,1);else if(P.jumps<2&&!g0)doJump(11.5,2)}
 P.v.y=Math.max(-32,P.v.y-(P.v.y<0?44:34)*dt);const vy0=P.v.y;
 P.p.x+=P.v.x*dt;resolve('x');P.p.z+=P.v.z*dt;resolve('z');P.p.y+=P.v.y*dt;P.ground=null;resolve('y');
 if(P.ground&&!g0&&vy0<-6){P.sq=Math.min(1,-vy0/22);burst(P.p.x,P.p.y+.1,P.p.z,0xcccccc,8)}
 if(P.p.y<-10){lose();return}
 if(has&&Math.hypot(P.v.x,P.v.z)>1)P.yaw=lerpA(P.yaw,Math.atan2(P.v.x,P.v.z),Math.min(1,dt*14))}
const lerpA=(a,b,t)=>a+(((b-a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*t;
function animHero(dt){const H=hero,sp=Math.hypot(P.v.x,P.v.z),g=!!P.ground;
 if(P.spin>0){P.spin-=dt;H.g.rotation.y=P.yaw+P.spin*20}else H.g.rotation.y=P.yaw;
 if(g){P.ph+=sp*dt*1.5;const a=Math.sin(P.ph)*Math.min(1,sp/6)*.9;H.lL.rotation.x=a;H.lR.rotation.x=-a;H.aL.rotation.x=-a*.9;H.aR.rotation.x=a*.9;H.aL.rotation.z=H.aR.rotation.z=0;H.body.position.y=Math.abs(Math.sin(P.ph))*.05*Math.min(1,sp/6)}
 else if(P.v.y>0){H.aL.rotation.x=H.aR.rotation.x=-2.4;H.lL.rotation.x=-.6;H.lR.rotation.x=.5;H.aL.rotation.z=H.aR.rotation.z=0}
 else{H.aL.rotation.x=H.aR.rotation.x=-1.2;H.aL.rotation.z=.7;H.aR.rotation.z=-.7;H.lL.rotation.x=H.lR.rotation.x=.3}
 P.sq=Math.max(0,P.sq-dt*4);H.body.scale.set(1+P.sq*.15,1-P.sq*.25,1+P.sq*.15);H.body.rotation.x=P.inv>1.2?-.5:0;
 H.g.visible=P.inv<=0||((P.inv*12)|0)%2==0;H.g.position.copy(P.p)}
/* ---------- game logic ---------- */
function hurt(dx,dz){if(P.inv>0||state!=='play')return;P.lives--;sfx.hit();shake=.6;SN.dmg=.8;if(SN.on)shrink(Math.ceil(SN.len*.3));
 if(P.lives<=0)return gameOver();P.inv=1.6;const l=Math.hypot(dx,dz)||1;P.v.set(dx/l*8,9,dz/l*8);P.ground=null;burst(P.p.x,P.p.y+1,P.p.z,0xff4040,16)}
function lose(){P.lives--;sfx.hit();shake=.7;if(P.lives<=0)return gameOver();P.p.copy(lastCP);P.v.set(0,0,0);P.inv=1.5;P.ground=null;if(SN.on){shrink(Math.ceil(SN.len*.25));trailReset()}}
function gameOver(){state='over';$('#hud').style.display='none';show('over')}
function eat(a){a.on=false;a.g.visible=false;appleN++;score+=a.type==1?500:100;grow(a.type==1?2:1);sfx.apple();
 if(a.type==2){SN.pow=8;sfx.pow()}burst(a.g.position.x,a.g.position.y+.3,a.g.position.z,[0xff4040,0xffd21a,0x40d0ff][a.type],14)}
function updateWorld(dt){
 for(const m of movers){const nx=m.bx+Math.sin(T*m.sp+m.ph)*m.r;m.s.dx=nx-m.s.m.position.x;m.s.m.position.x=nx;m.s.min.x=nx-m.s.w/2;m.s.max.x=nx+m.s.w/2}
 if(P.ground&&P.ground.dx)P.p.x+=P.ground.dx;
 P.inv-=dt;SN.pow-=dt;SN.dmg-=dt;updPlayer(dt);if(state!=='play')return;updSnake(dt);
 const p=P.p,cy=p.y+.9;
 for(const c of coins)if(c.on&&Math.abs(c.m.position.x-p.x)<.9&&Math.abs(c.m.position.z-p.z)<.9&&Math.abs(c.m.position.y-cy)<1.2){c.on=false;c.m.visible=false;coinN++;score+=10;sfx.coin();burst(c.m.position.x,c.m.position.y,c.m.position.z,0xffd21a,5)}
 for(const a of apPool)if(a.on){const q=a.g.position;if(Math.abs(q.x-p.x)<.9&&Math.abs(q.z-p.z)<.9&&Math.abs(q.y+.3-cy)<1.2)eat(a)}
 for(const e of enemies){if(!e.alive)continue;e.x=e.x0+Math.sin(T*1.3+e.ph)*e.r;e.g.position.set(e.x,e.y+Math.abs(Math.sin(T*5+e.ph))*.1,e.z);e.g.rotation.y=Math.cos(T*1.3+e.ph)>0?1.57:-1.57;
  const dx=p.x-e.x,dz=p.z-e.z,dy=p.y-e.y;
  if(Math.hypot(dx,dz)<.95&&dy>-1.5&&dy<1){if(P.v.y<0&&dy>.35){e.alive=false;e.g.visible=false;score+=200;P.v.y=K.Space?15:10;P.jumps=1;P.spin=.35;sfx.stomp();shake=.25;burst(e.x,e.y+.5,e.z,0xb060ff,16)}else hurt(dx,dz)}}
 for(const c of cps)if(!c.on&&Math.hypot(c.p.x-p.x,c.p.z-p.z)<2&&Math.abs(c.p.y-p.y)<3){c.on=true;c.fm.color.setHex(0x40e060);c.fm.emissive.setHex(0x105020);lastCP.copy(c.p).add({x:0,y:.05,z:1.5});sfx.pow();burst(c.p.x,c.p.y+2,c.p.z,0x40e060,14)}
 if(Math.hypot(goal.x-p.x,goal.z-p.z)<2.5&&Math.abs(goal.y-p.y)<3.5){state='clear';clearT=2.6;score+=1000;sfx.win();burst(goal.x,goal.y+2.5,goal.z,0xffd21a,40);show('clear')}
 spawnT-=dt;if(spawnT<=0){spawnT=5;if(apPool.filter(a=>a.on).length<8){const near=solids.filter(s=>!movers.some(m=>m.s===s)&&Math.abs(s.min.z-p.z)<30&&s.w>2),s=near[(Math.random()*near.length)|0];
  if(s){const r=Math.random(),x=s.min.x+.8+Math.random()*(s.w-1.6),z=s.min.z+.8+Math.random()*(s.d-1.6);if(Math.hypot(x-p.x,z-p.z)>2.5)placeApple(x,s.max.y+.7,z,r<.08?2:r<.2?1:0)}}}}
function hud(){$('#hl').textContent='❤️ '+P.lives;$('#hs').textContent='⭐ '+score;$('#ha').textContent='🍎 '+appleN;$('#hn').textContent='🐍 '+(SN.on?SN.len:0);$('#hc').textContent='🪙 '+coinN;$('#hv').textContent='Lv '+(LVI+1)+' · '+TH[LVI].n;
 $('#pb').style.width=(clamp(P.p.z/endZ,0,1)*100)+'%';const pw=$('#pw');pw.style.display=SN.pow>0?'inline':'none';pw.textContent='⚡ Speed '+Math.ceil(SN.pow)+'s'}
/* ---------- camera ---------- */
const lookS=new V3(),camP=new V3(0,5,-9),dv=new V3();let camYaw=0,camD=8,fov=60,shake=0;const pitch=.33;
function updCam(dt){
 if(state==='menu')camYaw+=dt*.25;
 const sp=Math.hypot(P.v.x,P.v.z),wd=7.5+Math.min(SN.len,40)*.06,wf=60+sp*.9+(SN.on?5:0)+(SN.pow>0?8:0);
 camD+=(wd-camD)*Math.min(1,dt*2);fov+=(wf-fov)*Math.min(1,dt*3);
 lookS.lerp(dv.set(P.p.x,P.p.y+1.5,P.p.z),1-Math.exp(-dt*9));
 const cx=-Math.sin(camYaw)*Math.cos(pitch),cy=Math.sin(pitch),cz=-Math.cos(camYaw)*Math.cos(pitch);let dist=camD;
 for(let s=1;s<=12;s++){const t=camD*s/12,x=lookS.x+cx*t,y=lookS.y+cy*t,z=lookS.z+cz*t;let hit=0;
  for(const b of solids)if(x>b.min.x-.3&&x<b.max.x+.3&&y>b.min.y-.3&&y<b.max.y+.3&&z>b.min.z-.3&&z<b.max.z+.3){hit=1;break}
  if(hit){dist=Math.max(1.5,camD*(s-1)/12);break}}
 dv.set(lookS.x+cx*dist,lookS.y+cy*dist,lookS.z+cz*dist);camP.lerp(dv,1-Math.exp(-dt*10));
 cam.position.set(camP.x+(Math.random()-.5)*shake,camP.y+(Math.random()-.5)*shake,camP.z+(Math.random()-.5)*shake);
 cam.lookAt(lookS);if(Math.abs(cam.fov-fov)>.05){cam.fov=fov;cam.updateProjectionMatrix()}shake=Math.max(0,shake-dt*2)}
/* ---------- UI ---------- */
const ov=$('#ov'),btn=(a,t,c='')=>`<button class="${c}" data-a="${a}">${t}</button>`;
function show(s){ov.style.display='flex';ov.innerHTML='<div class="card">'+({
 menu:`<h1>APPLE TRAIL</h1><p>Hop, stomp and grow your snake through three worlds.</p>${btn('play','▶ Play')}${btn('controls','Controls','g')}${btn('settings','Settings','g')}`,
 controls:`<h1>Controls</h1><p>WASD / Arrows – move<br>Space – jump (press again in air to double-jump)<br>Q / E or drag – rotate camera<br>Esc – pause</p><p>Eat apples to grow a snake that trails you. The longer it is, the slower you run. Don't run into your own body! Stomp enemies from above. 🟡 golden = bonus, 🔵 power = speed boost.</p>${btn('back','Back','g')}`,
 settings:`<h1>Settings</h1><p>Volume <input id="vol" type="range" min="0" max="1" step=".05" value="${cfg.vol}"></p><p><label><input id="shd" type="checkbox" ${cfg.shadow?'checked':''}> Shadows</label></p>${btn('back','Back','g')}`,
 pause:`<h1>Paused</h1>${btn('resume','Resume')}${btn('restart','Restart level','g')}${btn('controls','Controls','g')}${btn('settings','Settings','g')}${btn('menu','Main menu','g')}`,
 over:`<h1>Game Over</h1><p>Score ${score} · Apples ${appleN}</p>${btn('restart','Try again')}${btn('menu','Main menu','g')}`,
 win:`<h1>Victory! 🏆</h1><p>All three worlds conquered.<br>Score ${score} · Apples ${appleN} · Coins ${coinN}</p>${btn('play','Play again')}${btn('menu','Main menu','g')}`,
 clear:`<h1>Level Complete!</h1><p>Score ${score}</p>`}[s])+'</div>'}
function startGame(){score=coinN=appleN=0;P.lives=3;loadLevel(0)}
function loadLevel(n){makeLevel(n);lastCP.copy(spawn);P.p.copy(spawn);P.v.set(0,0,0);P.inv=0;P.ground=null;P.yaw=0;camYaw=0;SN.on=false;SN.len=0;SN.pow=0;SN.dmg=0;SN.st=-1;SEG.forEach(s=>s.visible=false);spawnT=3;state='play';ov.style.display='none';$('#hud').style.display='block'}
function togglePause(){if(state==='play'){state='pause';show('pause')}else if(state==='pause'){state='play';ov.style.display='none'}}
const ACT={play:startGame,controls:()=>show('controls'),settings:()=>show('settings'),back:()=>show(state==='pause'?'pause':state==='over'?'over':state==='win'?'win':'menu'),resume:togglePause,
 restart:()=>{P.lives=3;loadLevel(LVI)},menu:()=>{loadLevel(0);state='menu';$('#hud').style.display='none';show('menu')}};
ov.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;ac();sfx.ui();ACT[a]()});
ov.addEventListener('input',e=>{if(e.target.id=='vol'){cfg.vol=+e.target.value;if(master)master.gain.value=cfg.vol}if(e.target.id=='shd'){cfg.shadow=e.target.checked;sun.castShadow=cfg.shadow;R.shadowMap.enabled=cfg.shadow;S.traverse(o=>{if(o.material)o.material.needsUpdate=true})}});
/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,1/30);last=now;T+=dt;
 if(state==='play'){updateWorld(dt);hud()}
 else if(state==='clear'){clearT-=dt;if(clearT<=0){if(LVI<2)loadLevel(LVI+1);else{state='win';$('#hud').style.display='none';show('win')}}}
 if(state==='play'||state==='clear'||state==='menu'){
  for(const c of coins)if(c.on)c.m.rotation.y=T*3;
  for(const a of apPool)if(a.on){a.g.position.y=a.y0+Math.sin(T*3+a.g.position.x)*.12;a.g.rotation.y=T*1.5}
  for(const c of clouds){c.position.x+=dt*.8;if(c.position.x>130)c.position.x=-130}
  ring.rotation.y=T;water.position.set(P.p.x,-9+Math.sin(T)*.1,P.p.z);updParticles(dt)}
 animHero(dt);sun.position.set(P.p.x+20,P.p.y+35,P.p.z-12);sun.target.position.copy(P.p);updCam(dt);R.render(S,cam)}
loadLevel(0);state='menu';$('#hud').style.display='none';show('menu');requestAnimationFrame(frame);
