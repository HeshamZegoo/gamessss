<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jump Quest</title>
<style>
  :root{
    --sky1:#7ec8f2; --sky2:#bfe8ff; --ground:#8b5a2b; --grass:#4caf50;
    --ui-bg:rgba(0,0,0,0.55); --ui-text:#fff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#222;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  body{display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;}
  #wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;}
  canvas{width:100%;height:100%;display:block;border-radius:8px;background:linear-gradient(var(--sky1),var(--sky2));touch-action:none;}
  #hud{position:absolute;top:10px;left:10px;color:var(--ui-text);background:var(--ui-bg);
    padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600;}
  #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:var(--ui-text);background:var(--ui-bg);padding:16px 24px;border-radius:12px;
    font-size:20px;text-align:center;display:none;}
  #msg button{margin-top:10px;padding:8px 16px;border:none;border-radius:6px;background:#ffcc33;
    font-weight:700;cursor:pointer;}
  #controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 12px;pointer-events:none;}
  #controls button{pointer-events:auto;width:56px;height:56px;border-radius:50%;border:none;
    background:rgba(255,255,255,0.35);font-size:22px;color:#fff;}
  #left{display:flex;gap:10px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">⭐ <span id="coins">0</span>/<span id="total">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; Lvl <span id="lvl">1</span></div>
  <div id="msg"><div id="msgText"></div><button id="msgBtn">Continue</button></div>
  <div id="controls">
    <div id="left">
      <button id="btnL">◀</button>
      <button id="btnR">▶</button>
    </div>
    <button id="btnJ">⤴ Jump</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  canvas.width = canvas.clientWidth*dpr; canvas.height = canvas.clientHeight*dpr;
}
window.addEventListener('resize', resize); resize();

const W=()=>canvas.width, H=()=>canvas.height;
const GRAV=0.9, MOVE=5.5, JUMP=-17;
let coinsEl=document.getElementById('coins'), totalEl=document.getElementById('total'),
    livesEl=document.getElementById('lives'), lvlEl=document.getElementById('lvl');
let msg=document.getElementById('msg'), msgText=document.getElementById('msgText'), msgBtn=document.getElementById('msgBtn');

// Levels: platforms(x,y,w,h), coins(x,y), enemies(x,y,range), goal(x,y), spawn
const levels = [
  {
    spawn:{x:40,y:300},
    platforms:[{x:0,y:380,w:2400,h:40},{x:300,y:300,w:120,h:20},{x:500,y:250,w:120,h:20},
      {x:700,y:320,w:150,h:20},{x:950,y:260,w:100,h:20},{x:1150,y:200,w:100,h:20},
      {x:1400,y:300,w:200,h:20},{x:1700,y:340,w:150,h:20},{x:2000,y:280,w:150,h:20}],
    coins:[[340,260],[540,210],[740,280],[980,220],[1180,160],[1440,260],[1730,300],[2030,240],[2200,240]],
    enemies:[{x:500,y:376,range:120,x0:500},{x:950,y:376,range:100,x0:950},{x:1700,y:376,range:130,x0:1700}],
    goal:{x:2300,y:220}
  },
  {
    spawn:{x:40,y:300},
    platforms:[{x:0,y:380,w:600,h:40},{x:650,y:380,w:300,h:40},{x:1000,y:340,w:150,h:20},
      {x:1200,y:280,w:150,h:20},{x:1400,y:220,w:150,h:20},{x:1600,y:280,w:150,h:20},
      {x:1850,y:340,w:200,h:20},{x:2100,y:380,w:300,h:40}],
    coins:[[200,340],[700,340],[1040,300],[1240,240],[1440,180],[1640,240],[1900,300],[2200,340],[2350,340]],
    enemies:[{x:700,y:376,range:200,x0:700},{x:1200,y:236,range:80,x0:1200},{x:2150,y:376,range:200,x0:2150}],
    goal:{x:2350,y:260}
  }
];

let levelIdx=0, lvl, player, keys={}, camX=0, coinsCollected=0, lives=3, gameOver=false, paused=false;

function loadLevel(i){
  lvl = JSON.parse(JSON.stringify(levels[i]));
  player = {x:lvl.spawn.x,y:lvl.spawn.y,w:34,h:44,vx:0,vy:0,onGround:false,dir:1,dead:false,alive:true};
  coinsCollected=0;
  totalEl.textContent = lvl.coins.length;
  coinsEl.textContent = 0;
  lvlEl.textContent = i+1;
  lvl.enemies.forEach(e=>{e.vx=1.6;});
  camX=0;
}
loadLevel(0);

function rectsOverlap(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

function showMsg(text, cb){
  msgText.textContent=text;
  msg.style.display='block';
  msgBtn.onclick=()=>{msg.style.display='none'; cb&&cb();};
}

function resetPlayer(){
  player.x=lvl.spawn.x; player.y=lvl.spawn.y; player.vx=0; player.vy=0;
}

function loseLife(){
  lives--; livesEl.textContent=lives;
  if(lives<=0){
    gameOver=true;
    showMsg("Game Over! Final score: "+coinsCollected+" stars", ()=>{
      lives=3; livesEl.textContent=3; levelIdx=0; loadLevel(0); gameOver=false;
    });
  } else {
    resetPlayer();
  }
}

function update(){
  if(gameOver||paused) return;
  const scale = W()/900;
  // input
  let left = keys['ArrowLeft']||keys['a'];
  let right = keys['ArrowRight']||keys['d'];
  player.vx = 0;
  if(left){ player.vx=-MOVE; player.dir=-1; }
  if(right){ player.vx=MOVE; player.dir=1; }
  player.vy += GRAV;
  if(player.vy>20) player.vy=20;

  let px = player.x + player.vx;
  let py = player.y + player.vy;

  // horizontal collision
  let pbox = {x:px,y:player.y,w:player.w,h:player.h};
  for(const p of lvl.platforms){
    if(rectsOverlap(pbox,p)){
      if(player.vx>0) px = p.x-player.w;
      else if(player.vx<0) px = p.x+p.w;
    }
  }
  player.x = px;

  // vertical collision
  pbox = {x:player.x,y:py,w:player.w,h:player.h};
  player.onGround=false;
  for(const p of lvl.platforms){
    if(rectsOverlap(pbox,p)){
      if(player.vy>0){ py = p.y-player.h; player.onGround=true; player.vy=0; }
      else if(player.vy<0){ py = p.y+p.h; player.vy=0; }
    }
  }
  player.y = py;

  if(player.y>H()/scale+200){ loseLife(); return; }

  // coins
  lvl.coins = lvl.coins.filter(([cx,cy])=>{
    const cbox={x:cx-10,y:cy-10,w:20,h:20};
    if(rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h},cbox)){
      coinsCollected++; coinsEl.textContent=coinsCollected;
      return false;
    }
    return true;
  });

  // enemies
  for(const e of lvl.enemies){
    e.x += e.vx;
    if(e.x < e.x0-e.range/2 || e.x > e.x0+e.range/2) e.vx*=-1;
    const ebox={x:e.x,y:e.y-24,w:28,h:24};
    const pbox2={x:player.x,y:player.y,w:player.w,h:player.h};
    if(rectsOverlap(pbox2,ebox)){
      if(player.vy>0 && player.y+player.h-e.y< 16){
        // stomp
        e.dead=true; player.vy=-11;
      } else if(!e.dead){
        loseLife(); return;
      }
    }
  }
  lvl.enemies = lvl.enemies.filter(e=>!e.dead);

  // goal
  const gbox={x:lvl.goal.x,y:lvl.goal.y,w:20,h:80};
  if(!paused && rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h},gbox)){
    paused = true;
    if(levelIdx < levels.length-1){
      const nextIdx = levelIdx+1;
      showMsg("Level Complete! Stars: "+coinsCollected, ()=>{ levelIdx=nextIdx; loadLevel(levelIdx); paused=false; });
    } else {
      showMsg("🎉 You Win! Total stars: "+coinsCollected, ()=>{
        levelIdx=0; loadLevel(0); paused=false;
      });
    }
  }

  // camera
  camX = Math.max(0, player.x - (W()/scale)/2);
}

function draw(){
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.restore();

  const scale = W()/900;

  // --- sky (radial glow + sun) ---
  const skyGrad = ctx.createLinearGradient(0,0,0,canvas.height);
  skyGrad.addColorStop(0,'#3f8fe0'); skyGrad.addColorStop(0.6,'#8fd0f5'); skyGrad.addColorStop(1,'#d9f2ff');
  ctx.fillStyle = skyGrad; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  const sunX = canvas.width*0.8, sunY = canvas.height*0.18, sunR = canvas.height*0.12;
  const sunGlow = ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,sunR*2.2);
  sunGlow.addColorStop(0,'rgba(255,250,200,0.9)'); sunGlow.addColorStop(1,'rgba(255,250,200,0)');
  ctx.fillStyle=sunGlow; ctx.beginPath(); ctx.arc(sunX,sunY,sunR*2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff6c9'; ctx.beginPath(); ctx.arc(sunX,sunY,sunR,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // parallax clouds
  const t = performance.now()/1000;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<6;i++){
    const cx = ((i*260 - camX*0.15 + t*4) % (canvas.width+300)) - 150;
    const cy = canvas.height*(0.1+ (i%3)*0.08);
    const r = canvas.height*0.045;
    ctx.beginPath();
    ctx.ellipse(cx,cy,r*1.6,r,0,0,Math.PI*2);
    ctx.ellipse(cx+r*1.1,cy-r*0.4,r*1.1,r*0.8,0,0,Math.PI*2);
    ctx.ellipse(cx-r*1.1,cy-r*0.2,r*1.0,r*0.7,0,0,Math.PI*2);
    ctx.fill();
  }

  // parallax hills
  ctx.fillStyle='#5fae63';
  const hillY = canvas.height*0.72;
  ctx.beginPath(); ctx.moveTo(0,canvas.height);
  for(let x=0;x<=canvas.width;x+=40){
    const hx = x - (camX*0.35*scale)%400;
    ctx.lineTo(x, hillY + Math.sin((hx)/140)*canvas.height*0.05);
  }
  ctx.lineTo(canvas.width,canvas.height); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#3f8e4d';
  const hillY2 = canvas.height*0.8;
  ctx.beginPath(); ctx.moveTo(0,canvas.height);
  for(let x=0;x<=canvas.width;x+=40){
    const hx = x - (camX*0.55*scale)%500 + 90;
    ctx.lineTo(x, hillY2 + Math.sin((hx)/160)*canvas.height*0.04);
  }
  ctx.lineTo(canvas.width,canvas.height); ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.setTransform(scale,0,0,scale,-camX*scale,0);

  // ground with gradient + soil texture + grass highlight
  for(const p of lvl.platforms){
    const g = ctx.createLinearGradient(0,p.y,0,p.y+p.h);
    g.addColorStop(0,'#9c6a3d'); g.addColorStop(1,'#6b4423');
    ctx.fillStyle = g;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
    for(let sx=p.x+10; sx<p.x+p.w; sx+=22){
      ctx.beginPath(); ctx.moveTo(sx,p.y+10); ctx.lineTo(sx+6,p.y+p.h-6); ctx.stroke();
    }
    const grassGrad = ctx.createLinearGradient(0,p.y,0,p.y+10);
    grassGrad.addColorStop(0,'#7ee06a'); grassGrad.addColorStop(1,'#3f9c3f');
    ctx.fillStyle = grassGrad;
    ctx.fillRect(p.x,p.y,p.w,9);
    ctx.fillStyle='rgba(255,255,255,0.15)';
    ctx.fillRect(p.x,p.y,p.w,2);
  }

  // coins (glow, bob, squash for a spin effect)
  for(const [cx,cy] of lvl.coins){
    const bob = Math.sin(t*3 + cx*0.05)*3;
    const spin = Math.abs(Math.sin(t*2.4 + cx*0.03));
    const cyB = cy+bob;
    ctx.save();
    ctx.shadowColor='rgba(255,215,0,0.7)'; ctx.shadowBlur=10;
    const g = ctx.createRadialGradient(cx-3,cyB-3,1,cx,cyB,10);
    g.addColorStop(0,'#fff6c8'); g.addColorStop(0.5,'#ffd700'); g.addColorStop(1,'#c98a00');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.ellipse(cx,cyB,9*(0.35+0.65*spin),9,0,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='#8a5a00'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }

  // enemies (shaded body, ground shadow, subtle squish while walking)
  for(const e of lvl.enemies){
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(e.x+14,e.y+3,13,4,0,0,Math.PI*2); ctx.fill();
    const squish = 1+Math.sin(t*8+e.x*0.1)*0.05;
    const eg = ctx.createRadialGradient(e.x+9,e.y-18,2,e.x+14,e.y-12,16);
    eg.addColorStop(0,'#a862d6'); eg.addColorStop(1,'#5c2680');
    ctx.fillStyle=eg;
    ctx.beginPath();
    ctx.ellipse(e.x+14,e.y-12,14*squish,12/squish,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(e.x+9,e.y-14,3.2,0,Math.PI*2); ctx.arc(e.x+19,e.y-14,3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath(); ctx.arc(e.x+9+e.vx,e.y-14,1.4,0,Math.PI*2); ctx.arc(e.x+19+e.vx,e.y-14,1.4,0,Math.PI*2); ctx.fill();
  }

  // goal flag
  ctx.fillStyle='#555';
  ctx.fillRect(lvl.goal.x, lvl.goal.y, 6, 80);
  ctx.fillStyle='#ff3b30';
  ctx.beginPath();
  ctx.moveTo(lvl.goal.x+6, lvl.goal.y);
  ctx.lineTo(lvl.goal.x+40, lvl.goal.y+12);
  ctx.lineTo(lvl.goal.x+6, lvl.goal.y+24);
  ctx.fill();

  // player ground shadow
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.ellipse(player.x+player.w/2, player.y+player.h+3, player.w*0.45, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // player
  const running = Math.abs(player.vx)>0.5 && player.onGround;
  const walkT = t*10;
  ctx.save();
  ctx.translate(player.x+player.w/2, player.y+player.h/2);
  if(player.dir<0) ctx.scale(-1,1);

  // legs (animated swing)
  const legSwing = running ? Math.sin(walkT)*9 : (player.onGround?0:6);
  ctx.strokeStyle='#274690'; ctx.lineWidth=6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,player.h/2-14); ctx.lineTo(-6+legSwing*0.4, player.h/2+2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,player.h/2-14); ctx.lineTo(6-legSwing*0.4, player.h/2+2); ctx.stroke();

  // body with gradient shading
  const bodyGrad = ctx.createLinearGradient(-player.w/2,0,player.w/2,0);
  bodyGrad.addColorStop(0,'#c62836'); bodyGrad.addColorStop(0.5,'#f2434f'); bodyGrad.addColorStop(1,'#c62836');
  ctx.fillStyle=bodyGrad;
  ctx.beginPath();
  ctx.roundRect(-player.w/2,-player.h/2+10,player.w,player.h-16,6);
  ctx.fill();

  // arm
  const armSwing = running ? Math.sin(walkT+Math.PI)*8 : -4;
  ctx.strokeStyle='#f2434f'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(player.w/2-4,-player.h/2+16); ctx.lineTo(player.w/2+2+armSwing*0.3, -player.h/2+16+armSwing); ctx.stroke();

  // head with shading
  const headGrad = ctx.createRadialGradient(-4,-player.h/2+4,2,0,-player.h/2+8,13);
  headGrad.addColorStop(0,'#ffe8c4'); headGrad.addColorStop(1,'#e8ab6f');
  ctx.fillStyle=headGrad;
  ctx.beginPath(); ctx.arc(0,-player.h/2+8,13,0,Math.PI*2); ctx.fill();

  // face
  ctx.fillStyle='#2b1c14';
  ctx.beginPath(); ctx.arc(5,-player.h/2+7,1.6,0,Math.PI*2); ctx.fill();

  // cap with gradient
  const capGrad = ctx.createLinearGradient(0,-player.h/2-2,0,-player.h/2+8);
  capGrad.addColorStop(0,'#2f5fa8'); capGrad.addColorStop(1,'#16294f');
  ctx.fillStyle=capGrad;
  ctx.beginPath(); ctx.arc(0,-player.h/2+3,13,Math.PI,0); ctx.fill();
  ctx.fillRect(-13,-player.h/2-2,26,6);
  ctx.fillRect(10,-player.h/2-2,14,5);
  ctx.restore();

  ctx.restore();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e=>{
  keys[e.key]=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){ if(player.onGround){player.vy=JUMP;} }
});
window.addEventListener('keyup', e=>{ keys[e.key]=false; });

function bindHold(id,key){
  const el=document.getElementById(id);
  const on=(ev)=>{ev.preventDefault();keys[key]=true;};
  const off=(ev)=>{ev.preventDefault();keys[key]=false;};
  el.addEventListener('touchstart',on); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off);
}
bindHold('btnL','ArrowLeft');
bindHold('btnR','ArrowRight');
document.getElementById('btnJ').addEventListener('click', ()=>{ if(player.onGround) player.vy=JUMP; });
document.getElementById('btnJ').addEventListener('touchstart', (e)=>{ e.preventDefault(); if(player.onGround) player.vy=JUMP; });

requestAnimationFrame(loop);
</script>
</body>
</html>
